<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel City Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=9" />
  </head>
  <body>
    <main class="page">
      <header class="hud">
        <h1>Sabrina Carver</h1>
        <p>Welcome to my interactive resume! Guide Cheddar with arrow keys or WASD, or click on the building you would like to visit.</p>
        <div class="hud-actions" aria-label="Portfolio actions">
          <a class="hud-link" href="https://www.linkedin.com/in/sabrina-carver-28928624b/" target="_blank" rel="noreferrer">LinkedIn</a>
        </div>
      </header>

      <section class="map-shell">
        <aside id="tooltip" class="tooltip" aria-live="polite">
          <h2 id="tip-title">Cat Walk</h2>
          <p id="tip-text">Click on or walk Cheddar over to the building you would like to visit.</p>
          <p id="tip-meta" class="tip-meta">Tip: click any building and Cheddar will walk there for you.</p>
        </aside>

        <div class="map-viewport">
          <div id="map" class="map" aria-label="Interactive pixel city map">
            <div class="road-network" aria-hidden="true"></div>
            <div class="city-grid">
            <button class="building" data-id="police" data-approach="4,2|2,4|6,4|4,6" style="--col: 3; --row: 3; --w: 3; --h: 3; --art: url('assets/Police.png');"><span class="building-label">Police Station</span></button>
            <button class="building" data-id="courthouse" data-approach="9,2|7,4|11,4|9,6" style="--col: 8; --row: 3; --w: 3; --h: 3; --art: url('assets/Courthouse.png');"><span class="building-label">Courthouse</span></button>
            <button class="building" data-id="recycle" data-approach="14,2|12,4|16,4|14,6" style="--col: 13; --row: 3; --w: 3; --h: 3; --art: url('assets/Recycling-Center.png');"><span class="building-label">Recycling &amp; Waste</span></button>
            <button class="building" data-id="post" data-approach="19,2|17,4|21,4|19,6" style="--col: 18; --row: 3; --w: 3; --h: 3; --art: url('assets/Post-Office.png?v=2');"><span class="building-label">Post Office</span></button>
            <button class="building" data-id="gym" data-approach="24,2|22,4|26,4|24,6" style="--col: 23; --row: 3; --w: 3; --h: 3; --art: url('assets/Gym.png');"><span class="building-label">Gym</span></button>

            <button class="building" data-id="fire" data-approach="4,7|2,9|6,9|4,11" style="--col: 3; --row: 8; --w: 3; --h: 3; --art: url('assets/Fire-Station.png?v=2');"><span class="building-label">Fire Station</span></button>
            <button class="building" data-id="library" data-approach="9,7|7,9|11,9|9,11" style="--col: 8; --row: 8; --w: 3; --h: 3; --art: url('assets/Library.png?v=2');"><span class="building-label">Library</span></button>
            <button class="building" data-id="school" data-approach="14,7|12,9|16,9|14,11" style="--col: 13; --row: 8; --w: 3; --h: 3; --art: url('assets/School.png');"><span class="building-label">School</span></button>
            <button class="building" data-id="cityhall" data-approach="19,7|17,9|21,9|19,11" style="--col: 18; --row: 8; --w: 3; --h: 3; --art: url('assets/City-Hall.png');"><span class="building-label">City Hall</span></button>
            <button class="building" data-id="shop" data-approach="24,7|22,9|26,9|24,11" style="--col: 23; --row: 8; --w: 3; --h: 3; --art: url('assets/Shop.png');"><span class="building-label">Shop</span></button>

            <button class="building" data-id="university" data-approach="4,12|2,14|6,14|4,16" style="--col: 3; --row: 13; --w: 3; --h: 3; --art: url('assets/University.png?v=2');"><span class="building-label">University</span></button>
            <button class="building" data-id="hospital" data-approach="9,12|7,14|11,14|9,16" style="--col: 8; --row: 13; --w: 3; --h: 3; --art: url('assets/Hospital.png?v=3');"><span class="building-label">Hospital</span></button>
            <button class="building building-park" data-id="park" data-approach="15,12|18,12|12,14|21,14|15,16|18,16" style="--col: 13; --row: 13; --w: 8; --h: 3; --art: url('assets/Park.png?v=3');"><span class="building-label">Park</span></button>
            <button class="building" data-id="museum" data-approach="24,12|22,14|26,14|24,16" style="--col: 23; --row: 13; --w: 3; --h: 3; --art: url('assets/Museum.png?v=2');"><span class="building-label">Museum</span></button>

            <button class="building" data-id="bank" data-approach="4,17|2,19|6,19|4,21" style="--col: 3; --row: 18; --w: 3; --h: 3; --art: url('assets/Bank.png');"><span class="building-label">Bank</span></button>
            <button class="building" data-id="office" data-approach="9,17|7,19|11,19|9,21" style="--col: 8; --row: 18; --w: 3; --h: 3; --art: url('assets/Office.png?v=2');"><span class="building-label">Office</span></button>
            <button class="building" data-id="bakery" data-approach="14,17|12,19|16,19|14,21" style="--col: 13; --row: 18; --w: 3; --h: 3; --art: url('assets/Bakery.png');"><span class="building-label">Bakery</span></button>
            <button class="building" data-id="airport" data-approach="19,17|17,19|21,19|19,21" style="--col: 18; --row: 18; --w: 3; --h: 3; --art: url('assets/Airport.png?v=2');"><span class="building-label">Airport</span></button>
            <button class="building" data-id="home" data-approach="24,17|22,19|26,19|24,21" style="--col: 23; --row: 18; --w: 3; --h: 3; --art: url('assets/Home.png?v=2');"><span class="building-label">Home</span></button>
            </div>

            <div id="walker" class="walker" aria-hidden="true"></div>
          </div>
        </div>

        <nav class="mobile-controls" aria-label="Cheddar movement controls">
          <button class="move-button move-button-up" type="button" data-move="0,-1" aria-label="Move Cheddar up">Up</button>
          <button class="move-button move-button-left" type="button" data-move="-1,0" aria-label="Move Cheddar left">Left</button>
          <button class="move-button move-button-right" type="button" data-move="1,0" aria-label="Move Cheddar right">Right</button>
          <button class="move-button move-button-down" type="button" data-move="0,1" aria-label="Move Cheddar down">Down</button>
        </nav>
      </section>
    </main>

    <script src="script.js?v=3"></script>
  </body>
</html>
